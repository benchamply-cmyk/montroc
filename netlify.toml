# Configuration Netlify : le site est le dossier web/, publié tel quel (pas d'étape de build).
[build]
  publish = "web"
  command = ""

# En-têtes de sécurité sur toutes les pages.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Toujours servir le site sur troctroc.fr (sans www).
# troctroc.cloud est un alias : il redirige vers troctroc.fr, pour une seule adresse officielle.
[[redirects]]
  from = "https://www.troctroc.fr/*"
  to = "https://troctroc.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://troctroc.cloud/*"
  to = "https://troctroc.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.troctroc.cloud/*"
  to = "https://troctroc.fr/:splat"
  status = 301
  force = true
