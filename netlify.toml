# Les versions anglaise et espagnole sont générées depuis les mêmes sources françaises.
[build]
  publish = "web"
  command = "npm run build"

# En-têtes de sécurité sur toutes les pages.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"  # « Autour de moi » (localisation des objets et zone d'intérêt)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Toujours servir le site sur troctroc.fr (sans www).
[[redirects]]
  from = "https://www.troctroc.fr/*"
  to = "https://troctroc.fr/:splat"
  status = 301
  force = true
