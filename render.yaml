# Blueprint Render : l'API Python (https://api.toptroc.com).
# Render > New > Blueprint, choisir ce dépôt : le service est créé à partir de ce fichier.
services:
  - type: web
    name: montroc-api
    runtime: python
    region: frankfurt
    plan: free
    branch: prod
    # Ne redéploie que si l'API ou le moteur changent.
    buildFilter:
      paths:
        - api/**
        - algorithme/**
        - render.yaml
    buildCommand: pip install ./algorithme ./api
    # Les migrations passent avant chaque démarrage : la base est toujours au bon schéma.
    startCommand: cd api && alembic upgrade head && uvicorn montroc_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /sante
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        sync: false   # à coller dans Render : chaîne de connexion Neon (branche main)
      - key: CORS_ORIGINS
        # troctroc.fr reste autorisé pendant la transition (redirections 301, anciens onglets ouverts).
        value: https://toptroc.com,https://www.toptroc.com,https://troctroc.fr,https://www.troctroc.fr
      - key: ENVIRONNEMENT
        value: production
      - key: SITE_URL
        value: https://toptroc.com
      # E-mails : Render gratuit bloque les ports SMTP, on envoie par l'API HTTPS de Brevo.
      - key: BREVO_API_KEY
        sync: false
      # SMTP OVH : seulement sur une offre Render payante (ignoré si BREVO_API_KEY est renseignée).
      - key: SMTP_UTILISATEUR
        sync: false   # ex. contact@toptroc.com
      - key: SMTP_MOT_DE_PASSE
        sync: false
      - key: EMAIL_EXPEDITEUR
        value: TopTroc <contact@toptroc.com>   # l'expéditeur validé chez Brevo
      # Photos : la variable CLOUDINARY_URL du tableau de bord Cloudinary.
      - key: CLOUDINARY_URL
        sync: false
      # Comptes qui ont accès à la modération (e-mails séparés par des virgules).
      - key: MODERATEURS
        sync: false
      # Secret partagé avec la tâche planifiée GitHub Actions (rappels, expirations, math trade).
      - key: TACHES_SECRET
        sync: false
      # Lieu de dépôt affiché aux participants (adresse et horaires).
      - key: POINT_DE_DEPOT
        sync: false
      # Facultatif : un lieu par zone, « Marseille 6e = adresse ; Aix-en-Provence = adresse ».
      - key: POINTS_DE_DEPOT
        sync: false
      # Business model V2 (voir api/src/montroc_api/premium.py) : lieux publics conseillés pour la main propre,
      # liens de paiement Stripe « plus_mois = https://buy.stripe.com/… ; … », secret du webhook /premium/stripe,
      # portail client Stripe (résiliation), encart publicitaire « texte | lien ».
      - key: LIEUX_DE_RENCONTRE
        sync: false
      - key: STRIPE_LIENS
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PORTAIL
        sync: false
      - key: ENCART_PUBLICITE
        sync: false

  # Pré-production : même API, déployée depuis la branche preprod, sur une branche Neon « preprod » (copie de
  # la production). Les e-mails partent tous à COURRIELS_VERS, les SMS sont coupés : aucun membre n'est
  # contacté depuis la copie. Le Grand Troc s'y lance à la main (Actions > Tâches planifiées > preprod).
  - type: web
    name: montroc-api-preprod
    runtime: python
    region: frankfurt
    plan: free
    branch: preprod
    buildFilter:
      paths:
        - api/**
        - algorithme/**
        - render.yaml
    buildCommand: pip install ./algorithme ./api
    startCommand: cd api && alembic upgrade head && uvicorn montroc_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /sante
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        sync: false   # chaîne de connexion de la branche Neon « preprod »
      - key: CORS_ORIGINS
        value: https://preprod--troctroc.netlify.app
      - key: ENVIRONNEMENT
        value: preprod
      - key: SITE_URL
        value: https://preprod--troctroc.netlify.app
      - key: COURRIELS_VERS
        sync: false   # l'adresse qui reçoit tous les e-mails de la pré-production
      - key: SMS_ACTIFS
        value: "false"
      - key: ECHANGES_A_LA_DEMANDE
        value: "true"
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_EXPEDITEUR
        value: TopTroc preprod <contact@toptroc.com>
      - key: CLOUDINARY_URL
        sync: false
      - key: MODERATEURS
        sync: false
      - key: TACHES_SECRET
        sync: false   # même valeur que le secret GitHub TACHES_SECRET_PREPROD
      - key: POINT_DE_DEPOT
        value: Point de dépôt de test (pré-production)
      # Business model V2 (voir api/src/montroc_api/premium.py) : lieux publics conseillés pour la main propre,
      # liens de paiement Stripe « plus_mois = https://buy.stripe.com/… ; … », secret du webhook /premium/stripe,
      # portail client Stripe (résiliation), encart publicitaire « texte | lien ».
      - key: LIEUX_DE_RENCONTRE
        sync: false
      - key: STRIPE_LIENS
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PORTAIL
        sync: false
      - key: ENCART_PUBLICITE
        sync: false
