[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "montroc-api"
version = "0.1.0"
description = "API HTTP de montroc : utilisateurs, objets, souhaits et propositions d'échanges, stockés dans PostgreSQL."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "email-validator>=2.1",
    # Fuseau Europe/Paris (Grand Troc du dimanche à 18 h), même sans base de fuseaux sur le système.
    "tzdata",
    # Le moteur d'échanges vit dans ../algorithme ; installé avec `pip install -e ../algorithme`.
    "troc-echanges",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# Le dossier alembic/ du projet ne doit pas masquer le paquet alembic installé.
known-third-party = ["alembic"]
known-first-party = ["montroc_api", "troc_echanges"]
