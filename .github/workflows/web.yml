name: Site multilingue
on:
  pull_request:
  push:
    branches: [prod, preprod]
jobs:
  web:
    name: Site multilingue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
