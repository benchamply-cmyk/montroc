name: Versions

# Deux tâches :
# - lancé à la main avec un numéro (Actions > Versions > Run workflow, ex. 0.6.0) : prépare la version sur
#   preprod. Les lignes de changelog.d/ rejoignent CHANGELOG.md, VERSION change dans web/site.js, et la
#   branche chore/version-X.Y.Z part en PR vers preprod ;
# - à chaque arrivée sur main : si la VERSION de web/site.js n'a pas encore d'étiquette, on crée l'étiquette
#   vX.Y.Z et la Release GitHub, avec le texte de CHANGELOG.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à préparer sur preprod (ex. 0.6.0). Vide : seulement les étiquettes de main."
        required: false
        default: ""
      titre:
        description: "Titre de la version (facultatif)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  preparer:
    name: Préparer la version
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      TITRE: ${{ inputs.titre }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preprod
      - name: Rassembler changelog.d/ dans CHANGELOG.md
        run: python3 scripts/version.py "$VERSION" ${TITRE:+"$TITRE"}
      - name: Branche et PR vers preprod
        run: |
          branche="chore/version-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branche"
          git add -A CHANGELOG.md web/site.js changelog.d
          git commit -m "Version $VERSION"
          git push -u origin "$branche"
          # Une PR ouverte par ce robot ne lance pas la CI (règle de GitHub) : la fermer puis la rouvrir la lance.
          gh pr create --base preprod --head "$branche" --title "Version $VERSION" \
            --body "Prépare la version $VERSION : lignes de changelog.d/ rassemblées dans CHANGELOG.md, VERSION à $VERSION dans web/site.js. Fermer puis rouvrir la PR pour lancer la CI." \
            || echo "::warning::PR non créée (autoriser GitHub Actions à créer des PR dans Settings > Actions). Ouvrir : https://github.com/${{ github.repository }}/compare/preprod...$branche"

  etiquettes:
    name: Étiquettes et releases
    if: github.event_name == 'push' || inputs.version == ''
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Versions passées (une seule fois)
        run: |
          creer() { # version, commit
            gh release view "v$1" >/dev/null 2>&1 && return
            awk -v v="$1" '$0 ~ "^## \\[" v "\\]" {ok=1; next} /^(## )?\[/ {ok=0} ok' CHANGELOG.md > notes.md
            gh release create "v$1" --target "$2" --title "v$1" --notes-file notes.md
          }
          creer 0.1.0 9096857ce6992018137ecb49ebb4aa6c741daf9a
          creer 0.2.0 8499834cb37e3281aa17644587f2ccb3fa9e574f
          creer 0.3.0 46d63b091f0c642a624ebccfff7184747390b084
          creer 0.4.0 827fec4645404179f7bda7d1f1e23cd490b713be

      - name: Version actuelle
        run: |
          v=$(sed -n "s/.*const VERSION='\([0-9.]*\)'.*/\1/p" web/site.js)
          if [ -z "$v" ]; then echo "VERSION introuvable dans web/site.js"; exit 1; fi
          if gh release view "v$v" >/dev/null 2>&1; then echo "v$v existe déjà"; exit 0; fi
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {ok=1; next} /^(## )?\[/ {ok=0} ok' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Pas de section [$v] dans CHANGELOG.md"; exit 1; fi
          gh release create "v$v" --target "$GITHUB_SHA" --title "v$v" --notes-file notes.md

      # Ménage décidé par Ben le 2026-10-17 : branches dont la PR est déjà fusionnée dans main.
      # Une branche n'est supprimée que si elle pointe encore sur le commit attendu (rien de neuf dessus).
      - name: Ménage des anciennes branches (une seule fois)
        run: |
          while read -r branche commit; do
            actuel=$(gh api "repos/$GH_REPO/git/ref/heads/$branche" --jq .object.sha 2>/dev/null) || continue
            if [ "$actuel" = "$commit" ]; then
              gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branche" && echo "supprimée : $branche"
            else
              echo "gardée (nouveaux commits) : $branche"
            fi
          done <<'LISTE'
          claude/app-mobile 818fb70a798979c28edcabe844e0044cd55e04d1
          claude/app-mobile-objets-souhaits 86aea204c3c242df96253798c67b9aceaa43b21d
          claude/init-montroc-scdbjm ca216899264d715696d0f4d1391890de0d7f1640
          claude/project-thread-08z1b0 68f9129ca4e890164d732c0f5b226223e537d2cc
          claude/project-thread-2ey1xd 2c01f5fa0c04adcac7465b5403e4c2854d11ac3f
          claude/project-thread-2y1e6a 84b686da57ffecbfc3effdcda6b951bb3b9cea47
