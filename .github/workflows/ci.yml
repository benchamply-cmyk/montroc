name: CI

on:
  pull_request:
  push:
    branches: [main, preprod]

jobs:
  moteur:
    name: Moteur d'échanges
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Solveur exact (OR-Tools)
        run: pip install "ortools>=9.12"
      - name: Tests
        working-directory: algorithme
        run: python -m unittest discover -s tests

  api:
    name: API et base de données
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: montroc
          POSTGRES_PASSWORD: montroc
          POSTGRES_DB: montroc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U montroc"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://montroc:montroc@localhost:5432/montroc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Installation
        run: pip install ./algorithme "./api[dev]"
      - name: Style
        working-directory: api
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations à jour avec les modèles
        working-directory: api
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          alembic upgrade head
          alembic check
      - name: Tests
        working-directory: api
        run: pytest

  mobile:
    name: Application mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Installation
        run: npm ci
      - name: Vérification TypeScript
        run: npx tsc --noEmit
