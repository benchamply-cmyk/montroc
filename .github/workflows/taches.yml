name: Tâches planifiées

# Render (offre gratuite) n'a pas de tâches planifiées : GitHub Actions appelle l'API à la place.
# Secret à créer dans GitHub (Settings > Secrets and variables > Actions) : TACHES_SECRET,
# la même valeur que la variable TACHES_SECRET du service Render. Pour la pré-production, lancée seulement
# à la main : TACHES_SECRET_PREPROD, la valeur de TACHES_SECRET du service montroc-api-preprod.
on:
  schedule:
    - cron: "17 * * * *"  # toutes les heures : rappels « plus que 12 h », échanges expirés
    # Grand Troc du dimanche, 18 h à Paris : 16 h UTC en heure d'été, 17 h UTC en heure d'hiver. On appelle
    # à quatre heures ; l'API ne lance rien avant 18 h (heure de Paris) ni deux fois le même dimanche. Les
    # créneaux de 18 h et 19 h UTC rattrapent un déclenchement retardé ou sauté par GitHub : sans eux, en
    # heure d'hiver, un seul créneau (17 h UTC) tombait après 18 h à Paris.
    - cron: "7 16 * * 0"
    - cron: "7 17 * * 0"
    - cron: "7 18 * * 0"
    - cron: "7 19 * * 0"
  workflow_dispatch:
    inputs:
      tache:
        description: "Tâche à lancer"
        type: choice
        options: [horaires, grand-troc]
        default: horaires
      environnement:
        description: "Où lancer la tâche"
        type: choice
        options: [production, preprod]
        default: production

jobs:
  appeler:
    name: Appeler l'API
    runs-on: ubuntu-latest
    steps:
      - name: Choisir la tâche
        id: choix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.tache }}" = "grand-troc" ]; then
            # Lancement à la main : tout de suite, quel que soit le jour (une seule fois par jour).
            echo "tache=grand-troc?force=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tache=${{ inputs.tache }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" != "17 * * * *" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            # Les créneaux du dimanche (tous sauf la tâche horaire).
            echo "tache=grand-troc" >> "$GITHUB_OUTPUT"
          else
            echo "tache=horaires" >> "$GITHUB_OUTPUT"
          fi
      - name: Appel (l'API peut mettre une minute à se réveiller)
        env:
          # Les déclenchements planifiés visent toujours la production ; preprod seulement à la main.
          TACHES_SECRET: ${{ inputs.environnement == 'preprod' && secrets.TACHES_SECRET_PREPROD || secrets.TACHES_SECRET }}
          API: ${{ inputs.environnement == 'preprod' && 'https://montroc-api-preprod.onrender.com' || 'https://api.toptroc.com' }}
        run: |
          curl --fail-with-body --silent --show-error --retry 4 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST -H "X-Taches-Secret: $TACHES_SECRET" \
            "$API/taches/${{ steps.choix.outputs.tache }}"
